services:
  # ── Infrastructure ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: voltage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voltage"]
      interval: 5s
      timeout: 3s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/voltage-deployments --ignore-existing;
      mc anonymous set download local/voltage-deployments;
      echo 'Bucket created and set to public read.';
      exit 0;
      "

  # ── Application Services ──
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/voltage?schema=public
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  reverse-proxy:
    build:
      context: ./reverse-proxy
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - PROXY_PORT=8080
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

# ── Docker Network for Builder Containers ──
networks:
  default:
    name: voltage-network
  build-net:
    name: voltage-build-net
    driver: bridge
    internal: false  # Needs outbound for npm install / git clone

volumes:
  redis-data:
  minio-data:
  postgres-data:
